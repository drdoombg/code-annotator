<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Annotator V2 — Humannaire</title>
<style>
  :root {
    --bg:      #0d1117;
    --panel:   #161b22;
    --border:  #21262d;
    --text:    #e6edf3;
    --muted:   #7d8590;
    --accent:  #58a6ff;

    /* token colours */
    --c-tag:      #ff7b72;
    --c-attr:     #ffa657;
    --c-value:    #a5d6ff;
    --c-selector: #d2a8ff;
    --c-prop:     #79c0ff;
    --c-csval:    #56d364;
    --c-keyword:  #ff7b72;
    --c-func:     #e3b341;
    --c-string:   #a5d6ff;
    --c-comment:  #6e7681;
    --c-number:   #79c0ff;
    --c-operator: #ff7b72;
    --c-dom:      #56d364;
    --c-event:    #d2a8ff;
    --c-plain:    #e6edf3;

    /* BLOCK palette — translucent */
    --blk0:  rgba(255,123,114, 0.08);   /* red-ish   → DOCTYPE / html shell */
    --blk1:  rgba(100,180,255, 0.08);   /* blue      → <head> / meta */
    --blk2:  rgba(86, 211,100, 0.08);   /* green     → CSS :root vars */
    --blk3:  rgba(210,168,255, 0.09);   /* purple    → CSS selectors block */
    --blk4:  rgba(255,166, 87, 0.08);   /* orange    → HTML body structure */
    --blk5:  rgba(227,179, 65, 0.08);   /* yellow    → JS state / variables */
    --blk6:  rgba(86, 211,100, 0.09);   /* green2    → JS functions */
    --blk7:  rgba(255,123,114, 0.09);   /* red2      → JS event handlers */
    --blk8:  rgba(100,180,255, 0.09);   /* blue2     → JS utility / misc */
    --blk9:  rgba(210,168,255, 0.08);   /* purple2   → closing tags */
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}

  /* ── TOP BAR ── */
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:11px 20px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:200;flex-wrap:wrap;
  }
  .logo{font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:-.02em;}
  .logo span{color:var(--text);}
  .upload-btn{background:var(--accent);border:none;border-radius:6px;padding:7px 16px;
    color:#0d1117;font-weight:600;font-size:.82rem;cursor:pointer;transition:opacity .15s;}
  .upload-btn:hover{opacity:.85;}
  #fileInput{display:none;}
  .file-name{color:var(--muted);font-size:.8rem;}
  .view-toggle{display:flex;gap:6px;margin-left:auto;}
  .vtbtn{background:var(--border);border:1px solid var(--muted);border-radius:6px;
    padding:6px 12px;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .12s;}
  .vtbtn.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600;}

  /* ── LEGEND ── */
  .legend{display:flex;gap:10px;flex-wrap:wrap;padding:7px 20px;
    background:#0d1117;border-bottom:1px solid var(--border);}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);}
  .leg-dot{width:9px;height:9px;border-radius:2px;}

  /* ── WORKSPACE ── */
  /* single shared scroll region so the two columns move together and stay aligned */
  .workspace{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 90px);overflow-y:auto;align-items:start;}

  /* ── CODE PANEL ── */
  .code-panel{overflow-x:auto;overflow-y:visible;border-right:1px solid var(--border);}
  .code-table{width:100%;border-collapse:collapse;
    font-family:'Fira Code','Cascadia Code','Consolas',monospace;font-size:12.5px;}
  .code-table td{vertical-align:top;padding:0;}

  /* Line-number cell */
  .ln{color:#3d444d;user-select:none;text-align:right;
    padding:0 12px 0 18px;min-width:42px;
    border-right:1px solid var(--border);white-space:nowrap;}

  /* Block label column */
  .blabel-cell{width:6px;padding:0;}

  /* Code content */
  .lc{padding:0 10px;white-space:pre;line-height:1.65;}

  /* BLOCK ROWS — background spans full width via tr */
  .code-table tr.blk-row-0  { background: var(--blk0); }
  .code-table tr.blk-row-1  { background: var(--blk1); }
  .code-table tr.blk-row-2  { background: var(--blk2); }
  .code-table tr.blk-row-3  { background: var(--blk3); }
  .code-table tr.blk-row-4  { background: var(--blk4); }
  .code-table tr.blk-row-5  { background: var(--blk5); }
  .code-table tr.blk-row-6  { background: var(--blk6); }
  .code-table tr.blk-row-7  { background: var(--blk7); }
  .code-table tr.blk-row-8  { background: var(--blk8); }
  .code-table tr.blk-row-9  { background: var(--blk9); }

  /* First line of a block gets a left accent bar */
  .code-table tr.blk-first td.blabel-cell {
    border-left: 3px solid transparent;
  }

  /* block separator line */
  .code-table tr.blk-first td { border-top: 1px solid rgba(255,255,255,.05); }

  /* Token colours */
  .tok-tag      { color:var(--c-tag);      }
  .tok-attr     { color:var(--c-attr);     }
  .tok-value    { color:var(--c-value);    }
  .tok-selector { color:var(--c-selector); }
  .tok-prop     { color:var(--c-prop);     }
  .tok-csval    { color:var(--c-csval);    }
  .tok-keyword  { color:var(--c-keyword);  font-weight:600; }
  .tok-func     { color:var(--c-func);     }
  .tok-string   { color:var(--c-string);   }
  .tok-comment  { color:var(--c-comment);  font-style:italic; }
  .tok-number   { color:var(--c-number);   }
  .tok-operator { color:var(--c-operator); }
  .tok-dom      { color:var(--c-dom);      }
  .tok-event    { color:var(--c-event);    }
  .tok-punct    { color:#8b949e;           }
  .tok-plain    { color:var(--c-plain);    }

  /* ── ANNOTATION PANEL ── */
  .ann-panel{background:var(--panel);overflow-y:visible;padding:14px 14px;position:relative;}

  /* ── TOKEN INSPECTOR POPOVER (select any word in the code) ── */
  .tok-popover{
    position:absolute;left:8px;right:8px;z-index:50;
    background:#0d1117;border:1px solid var(--accent);border-radius:8px;
    padding:10px 26px 10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.5);
  }
  .tok-popover::before{
    content:'';position:absolute;left:-7px;top:16px;width:12px;height:12px;
    background:#0d1117;border-left:1px solid var(--accent);border-bottom:1px solid var(--accent);
    transform:rotate(45deg);
  }
  .tok-pop-close{position:absolute;top:7px;right:10px;cursor:pointer;color:var(--muted);font-size:.75rem;line-height:1;}
  .tok-pop-close:hover{color:var(--text);}
  .tok-pop-word{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--text);margin:2px 0 5px;}
  .tok-pop-body{font-size:.77rem;color:#adbac7;line-height:1.6;}
  .tok-pop-body em{color:var(--accent);font-style:normal;font-weight:600;}
  .ann-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin-bottom:10px;font-weight:600;}

  .ann-block-card{
    border-radius:8px;padding:12px 14px;margin-bottom:10px;
    border-left:4px solid #30363d;
    transition:box-shadow .15s, border-color .15s;
    cursor:default;
    background:#0d1117;
  }
  .ann-block-card:hover { box-shadow: 0 0 0 1px rgba(88,166,255,.3); }
  .ann-block-card.active-card { border-color: var(--accent) !important; box-shadow: 0 0 0 1px rgba(88,166,255,.25); }

  .ann-chip{display:inline-block;font-size:.62rem;padding:1px 7px;border-radius:10px;
    font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .ann-block-title{font-family:monospace;font-size:.9rem;font-weight:700;
    margin-bottom:5px;color:var(--text);}
  .ann-block-body{font-size:.77rem;color:#adbac7;line-height:1.6;}
  .ann-block-body em{color:var(--accent);font-style:normal;font-weight:600;}
  .ann-block-body ul{margin:6px 0 0 14px;}
  .ann-block-body li{margin-bottom:2px;}
  .ann-lines{font-size:.65rem;color:var(--muted);margin-top:6px;}

  /* ── FLOW PANEL ── */
  .flow-panel{display:none;padding:24px;overflow-y:auto;grid-column:1/-1;}
  .flow-panel.visible{display:block;}
  .flow-title{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:20px;}
  .flow-svg-wrap{overflow-x:auto;}
  svg.flowchart{ display:block; }
  .fc-label{font-family:-apple-system,sans-serif;font-size:9.5px;fill:#7d8590;}

  /* ── EMPTY ── */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:70vh;color:var(--muted);gap:12px;grid-column:1/-1;}
  .empty-icon{font-size:3rem;}
  .empty-title{font-size:1.1rem;font-weight:600;color:var(--text);}
  .empty-sub{font-size:.82rem;text-align:center;max-width:340px;}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Code<span>Annotator</span> <span style="font-size:.7rem;color:var(--muted);font-weight:400;">V2</span></div>
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📂 Upload HTML / JS / CSS</button>
  <input type="file" id="fileInput" accept=".html,.htm,.js,.css"/>
  <span class="file-name" id="fileName">No file loaded</span>
  <div class="view-toggle">
    <button class="vtbtn active" onclick="switchView('annotated')" id="btn-annotated">📋 Annotated Code</button>
    <button class="vtbtn" onclick="switchView('flow')" id="btn-flow">🔀 Logic Flow</button>
  </div>
</div>

<!-- LEGEND -->
<div class="legend" id="legend" style="display:none;">
  <div class="leg-item"><div class="leg-dot" style="background:rgba(255,123,114,.5)"></div>HTML Shell</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(100,180,255,.5)"></div>Head / Meta</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(86,211,100,.5)"></div>CSS Variables</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(210,168,255,.5)"></div>CSS Rules</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(255,166,87,.5)"></div>HTML Body</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(227,179,65,.5)"></div>JS State</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(86,211,100,.5)"></div>JS Functions</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(255,123,114,.5)"></div>JS Events / Handlers</div>
  <div class="leg-item"><div class="leg-dot" style="background:rgba(100,180,255,.5)"></div>JS Utility</div>
</div>

<!-- WORKSPACE -->
<div class="workspace" id="workspace">
  <div class="empty" id="emptyState">
    <div class="empty-icon">🧩</div>
    <div class="empty-title">Upload a code file to annotate</div>
    <div class="empty-sub">HTML, CSS, or JS — the annotator colour-blocks each semantic region and explains it block by block in the sidebar.</div>
  </div>
</div>

<script>

  { id:2, color:'rgba(86,211,100,.08)',  accent:'#56d364', label:'CSS Variables',     emoji:'🎨' },
  { id:3, color:'rgba(210,168,255,.09)', accent:'#d2a8ff', label:'CSS Rules',         emoji:'🖌️' },

// ══════════════════════════════════════════════
//  BLOCK SEGMENTER — splits raw code into semantic blocks
// ══════════════════════════════════════════════
function segmentCode(raw, type) {
  const lines = raw.split('\n');
  const blocks = [];   // [{ paletteId, startLine, endLine, label, annotation, lines:[...] }]

  if (type === 'html') {
    let mode = 'html';      // html | css | js
    let cssDepth = 0;
    let jsDepth  = 0;
    let inRoot   = false;

    // Rough pass: assign each line to a semantic block
    let current = null;
    const flush = () => { if (current) { blocks.push(current); current = null; } };
    const newBlock = (id, label) => {
      flush();
      current = { paletteId: id, label, startLine: null, endLine: null, linesData: [] };
    };

    lines.forEach((line, i) => {
      const lno = i + 1;
      const lt  = line.trim().toLowerCase();
      const l   = line.trim();

      // Detect mode switches
      if (mode === 'html') {
        if (lt.startsWith('<style')) { mode = 'css'; cssDepth = 0; }
        else if (lt.startsWith('<script')) { mode = 'js'; jsDepth = 0; }
      } else if (mode === 'css') {
        if (lt.startsWith('</style')) mode = 'html';
      } else if (mode === 'js') {
        if (lt.startsWith('</script')) mode = 'html';
      }

      // Decide palette bucket for this line
      let targetId;
      let targetLabel;

      if (mode === 'html') {
        if (lt === '<!doctype html>' || lt === '<html' || lt.startsWith('<html ') || lt === '<html lang') {
          targetId = 0; targetLabel = 'HTML Shell';
        } else if (lt.startsWith('<head') || lt === '</head>') {
          targetId = 1; targetLabel = 'Head / Meta';
        } else if (lt.startsWith('<body') || lt.startsWith('</body') || lt.startsWith('</html')) {
          targetId = 9; targetLabel = 'Close / Footer';
        } else if (lt.startsWith('<style') || lt.startsWith('</style')) {
          // style tag itself goes with CSS block
          targetId = 3; targetLabel = 'CSS Rules';
        } else if (lt.startsWith('<script') || lt.startsWith('</script')) {
          targetId = 6; targetLabel = 'JS Functions';
        } else if (current) {
          // inside head
          targetId = 1; targetLabel = 'Head / Meta';
        } else {
          targetId = 4; targetLabel = 'HTML Body';
        }
      } else if (mode === 'css') {
        if (lt.startsWith(':root') || lt.startsWith('--') || inRoot) {
          if (lt === ':root {' || lt === ':root{') inRoot = true;
          if (inRoot && lt === '}') inRoot = false;
          targetId = 2; targetLabel = 'CSS Variables (:root)';
        } else {
          targetId = 3; targetLabel = 'CSS Rules';
        }
      } else { // js
        // Classify JS lines
        const hasFunction = /\bfunction\b/.test(line) || /\b(?:const|let|var)\s+\w+\s*=\s*(?:async\s+)?(?:\(|function)/.test(line);
        const hasEventListener = /addEventListener|\.on\w+\s*=/.test(line);
        const isStateDecl = /^(?:let|const|var)\s+\w+/.test(l) && !hasFunction;
        const isUtil = /^(?:function\s+escHtml|function\s+esc|\/\/ ?═)/.test(l);

        if (hasFunction || (current && current.paletteId === 6 && !hasEventListener)) {
          targetId = 6; targetLabel = 'JS Functions';
        } else if (hasEventListener) {
          targetId = 7; targetLabel = 'JS Event Handlers';
        } else if (isStateDecl) {
          targetId = 5; targetLabel = 'JS State & Data';
        } else {
          targetId = current ? current.paletteId : 5;
          targetLabel = current ? current.label : 'JS State & Data';
        }
      }

      // Check if we need to start a new block
      if (!current || current.paletteId !== targetId) {
        flush();
        current = { paletteId: targetId, label: targetLabel, startLine: lno, endLine: lno, linesData: [] };
      }
      current.endLine = lno;
      if (current.startLine === null) current.startLine = lno;
      current.linesData.push({ lno, raw: line, mode: mode === 'html' ? (lt.startsWith('<style') ? 'css' : (lt.startsWith('<script') ? 'js' : 'html')) : mode });
    });
    flush();

  } else if (type === 'css') {
    // Whole file CSS — split into :root block + rules block
    let inRoot = false;
    let current = null;
    const flush = () => { if (current) blocks.push(current); current = null; };
    const newBlock = (id, label, lno) => { flush(); current = { paletteId: id, label, startLine: lno, endLine: lno, linesData: [] }; };

    lines.forEach((line, i) => {
      const lno = i + 1;
      const lt = line.trim().toLowerCase();
      if (lt === ':root {' || lt === ':root{') { inRoot = true; newBlock(2,'CSS Variables',lno); }
      else if (inRoot && lt === '}') { inRoot = false; }
      else if (!current) newBlock(3,'CSS Rules',lno);
      current.endLine = lno;
      current.linesData.push({ lno, raw: line, mode: 'css' });
    });
    flush();

  } else {
    // Pure JS
    lines.forEach((line, i) => {
      const lno = i + 1;
      const l = line.trim();
      const hasFunction = /\bfunction\b/.test(line) || /\b(?:const|let|var)\s+\w+\s*=\s*(?:async\s+)?(?:\(|function)/.test(line);
      const hasEventListener = /addEventListener/.test(line);
      const isStateDecl = /^(?:let|const|var)\s+\w+/.test(l) && !hasFunction;
      let pid = hasEventListener ? 7 : hasFunction ? 6 : isStateDecl ? 5 : 8;
      let lbl = ['JS State & Data','JS Functions','JS Event Handlers','JS Utility'][pid===7?2:pid===6?1:pid===5?0:3];
      const last = blocks[blocks.length-1];
      if (!last || last.paletteId !== pid) {
        blocks.push({ paletteId: pid, label: lbl, startLine: lno, endLine: lno, linesData: [] });
      }
      const cur = blocks[blocks.length-1];
      cur.endLine = lno;
      cur.linesData.push({ lno, raw: line, mode: 'js' });
    });
  }

  // Post-process: generate annotations for each block
  blocks.forEach(blk => buildBlockAnnotation(blk));
  return blocks;
}

// ══════════════════════════════════════════════
//  BUILD BLOCK ANNOTATION
// ══════════════════════════════════════════════
function buildBlockAnnotation(blk) {
  const raw = blk.linesData.map(l => l.raw).join('\n');
  const lt  = raw.toLowerCase();
  let items = [];

  if (blk.paletteId === 0) {
    items = [
      '🏗️ This is the <em>outermost wrapper</em> of the document.',
      'The <em>&lt;!DOCTYPE html&gt;</em> declaration tells the browser "this is modern HTML5 — use standard mode."',
      'The <em>lang</em> attribute on &lt;html&gt; tells screen readers and search engines what language the page is in.',
    ];
  } else if (blk.paletteId === 1) {
    const tags = [];
    if (lt.includes('<meta')) tags.push('<em>&lt;meta&gt;</em> tags give the browser instructions invisible to the user — charset, viewport width, page description');
    if (lt.includes('<title')) tags.push('<em>&lt;title&gt;</em> sets the browser tab text and the Google search result headline');
    if (lt.includes('<link')) tags.push('<em>&lt;link&gt;</em> pulls in external resources — usually CSS stylesheets');
    if (lt.includes('charset')) tags.push('<em>charset="UTF-8"</em> means every language and emoji is supported');
    if (lt.includes('viewport')) tags.push('<em>viewport</em> meta makes the page adapt to mobile screen widths');
    if (!tags.length) tags.push('The &lt;head&gt; is invisible to users but vital for the browser and search engines.');
    items = tags;
  } else if (blk.paletteId === 2) {
    items = [
      '🎨 CSS <em>custom properties</em> (also called CSS variables) are defined here under <em>:root</em> — the whole document scope.',
      'Each line follows the pattern <em>--name: value;</em> — the double dash is what makes it a variable.',
      'Any CSS rule below can use these with <em>var(--name)</em>, so changing one value here updates every element that uses it.',
      'This is a design system in miniature — colour palette, spacing scale, and semantic names all in one place.',
    ];
    // extract variable names
    const vars = (raw.match(/--[\w-]+/g) || []).slice(0,8);
    if (vars.length) items.push(`Variables declared here: <em>${vars.join(', ')}</em>`);
  } else if (blk.paletteId === 3) {
    // CSS rules block
    const selectors = (raw.match(/^[ \t]*\.[\w-]+|^[ \t]*#[\w-]+|^[ \t]*[a-z][\w-]*/gm) || [])
      .map(s => s.trim()).filter(s => s && !s.startsWith('--') && !s.startsWith('/*')).slice(0,6);
    items = [
      '🖌️ This block contains CSS <em>rule sets</em> — each targets specific elements and defines how they look.',
      'Format: <em>selector { property: value; }</em>',
      selectors.length ? `Selectors in this block: <em>${selectors.join(', ')}</em>` : '',
    ].filter(Boolean);
    // pick some notable properties
    const notable = Object.keys(ANN_LIB.cssProps).filter(p => lt.includes(p+':'));
    if (notable.length) items.push(`Notable properties: <em>${notable.slice(0,5).join(', ')}</em>`);
  } else if (blk.paletteId === 4) {
    // HTML body
    const tags = (raw.match(/<(\w+)/g)||[]).map(t=>t.slice(1)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,7);
    items = [
      '📄 This is the <em>visible HTML</em> — everything here appears on screen.',
      tags.length ? `Elements used: <em>&lt;${tags.join('&gt;, &lt;')}&gt;</em>` : '',
    ].filter(Boolean);
    if (lt.includes('class=')) items.push('Elements have <em>class</em> attributes that connect them to the CSS rules above.');
    if (lt.includes('onclick') || lt.includes('id=')) items.push('<em>id</em> and <em>onclick</em> attributes let the JavaScript below target and control these elements.');
  } else if (blk.paletteId === 5) {
    // JS State
    const vars = (raw.match(/(?:let|const|var)\s+([a-zA-Z_$][\w$]*)/g)||[]).map(m=>m.split(/\s+/)[1]).slice(0,8);
    items = [
      '🗂️ This is the <em>state layer</em> — variables that track what the application knows and remembers.',
      vars.length ? `Variables declared: <em>${vars.join(', ')}</em>` : '',
      'These values change as the user interacts — they are the app\'s <em>memory</em>.',
    ].filter(Boolean);
    if (lt.includes('set')) items.push('A <em>Set</em> is like an array but every item is unique — no duplicates ever.');
    if (lt.includes('[]')) items.push('Empty arrays <em>[]</em> are initialised here and filled later as data arrives.');
    if (lt.includes('false') || lt.includes('true')) items.push('Boolean flags track on/off states: answered, visible, active…');
  } else if (blk.paletteId === 6) {
    // JS Functions
    const fnames = (raw.match(/function\s+([a-zA-Z_$][\w$]*)/g)||[]).map(m=>m.split(/\s+/)[1]);
    const arrowFns = (raw.match(/(?:const|let)\s+([a-zA-Z_$][\w$]*)\s*=/g)||[]).map(m=>m.split(/\s+/)[1]);
    const allFns = [...new Set([...fnames,...arrowFns])].slice(0,6);
    items = [
      '⚙️ This block defines <em>functions</em> — named reusable chunks of logic.',
      allFns.length ? `Functions: <em>${allFns.join(', ')}</em>` : '',
      'Each function is a <em>recipe</em>: call it by name and it executes its steps.',
    ].filter(Boolean);
    if (lt.includes('document.getelementbyid') || lt.includes('queryselector')) items.push('Functions here reach into the <em>DOM</em> — finding and updating HTML elements on screen.');
    if (lt.includes('.style.display')) items.push('<em>.style.display</em> switches elements visible/hidden by toggling CSS values in JS.');
    if (lt.includes('foreach') || lt.includes('for (') || lt.includes('for(')) items.push('Loops iterate over lists of data to build or update multiple elements at once.');
  } else if (blk.paletteId === 7) {
    // JS Event Handlers
    items = [
      '🔌 Event handlers make the app <em>respond to user actions</em>.',
      '<em>addEventListener</em> listens for events like clicks, key presses, form submissions, or mouse moves.',
      'Each handler calls a function from the block above — keeping logic and wiring separate.',
    ];
    const events = (raw.match(/'(click|input|change|submit|keydown|keyup|load|scroll|focus|blur|mouseover|mouseout|resize)'/g)||[]).map(e=>e.replace(/'/g,''));
    if (events.length) items.push(`Events wired up: <em>${[...new Set(events)].join(', ')}</em>`);
  } else if (blk.paletteId === 8) {
    items = [
      '🔧 Utility code — helper functions and setup that supports the main logic.',
      'These are small, generic tools: string escaping, formatting, conversions.',
    ];
    if (lt.includes('json.parse') || lt.includes('json.stringify')) items.push('<em>JSON</em> methods convert between raw string data and live JavaScript objects.');
  } else if (blk.paletteId === 9) {
    items = [
      '🔚 Closing tags — these close the HTML skeleton opened at the top.',
      '<em>&lt;/body&gt;</em> ends the visible content. <em>&lt;/html&gt;</em> ends the document.',
      'Everything must be properly nested and closed for the browser to render correctly.',
    ];
  }

  blk.annotation = { items };
}

// ══════════════════════════════════════════════
//  TOKENISER (line-level syntax colouring)
// ══════════════════════════════════════════════
const JS_KEYWORDS = new Set(['function','const','let','var','return','if','else','for','while',
  'do','switch','case','break','continue','new','class','extends','super','import','export',
  'default','async','await','try','catch','finally','throw','typeof','instanceof','in','of',
  'true','false','null','undefined','this','delete','void']);
const DOM_METHODS = new Set(['getElementById','getElementsByClassName','getElementsByTagName',
  'querySelector','querySelectorAll','createElement','appendChild','removeChild','insertBefore',
  'setAttribute','getAttribute','addEventListener','removeEventListener','classList','innerHTML',
  'textContent','style','dataset','closest','matches','append','prepend','remove','replaceWith',
  'dispatchEvent','focus','blur','click','submit','reset','forEach','map','filter','reduce',
  'indexOf','includes','push','pop','shift','unshift','splice','slice','sort','join','split',
  'trim','replace','parseInt','parseFloat','JSON','JSON.parse','JSON.stringify','Math',
  'Math.random','Math.round','Math.floor','Math.ceil','Math.min','Math.max','console',
  'console.log','setTimeout','setInterval','clearTimeout','clearInterval','fetch','Promise',
  'document','window','localStorage','sessionStorage','alert','confirm','prompt']);
const JS_EVENTS = new Set(['click','dblclick','mousedown','mouseup','mouseover','mouseout',
  'mousemove','keydown','keyup','keypress','input','change','submit','reset','focus','blur',
  'load','unload','resize','scroll','touchstart','touchend','touchmove','contextmenu','wheel']);

function tokeniseLine(line, mode) {
  if (mode === 'css') return tokeniseCSS(line);
  if (mode === 'js')  return tokeniseJS(line);
  return tokeniseHTML(line);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function tokeniseHTML(line) {
  let out='', i=0;
  while(i<line.length){
    if(line[i]==='<'){
      if(line.slice(i,i+4)==='<!--'){
        const end=line.indexOf('-->',i);
        const chunk=end===-1?line.slice(i):line.slice(i,end+3);
        out+=`<span class="tok-comment">${esc(chunk)}</span>`; i+=chunk.length; continue;
      }
      const cs=line[i+1]==='/'; let j=i+1+(cs?1:0), tn='';
      while(j<line.length&&/[a-zA-Z0-9\-]/.test(line[j])) tn+=line[j++];
      if(tn){
        out+=`<span class="tok-tag">&lt;${cs?'/':''}</span><span class="tok-tag">${esc(tn)}</span>`; i=j;
        while(i<line.length&&line[i]!=='>'){
          if(line[i]==='/'){ out+=`<span class="tok-tag">/</span>`; i++; continue; }
          if(/\s/.test(line[i])){ out+=line[i]; i++; continue; }
          let an='';
          while(i<line.length&&/[a-zA-Z0-9\-:\.]/.test(line[i])) an+=line[i++];
          if(an) out+=`<span class="tok-attr">${esc(an)}</span>`;
          if(line[i]==='='){ out+=`<span class="tok-punct">=</span>`; i++;
            if(line[i]==='"'||line[i]==="'"){
              const q=line[i]; let v=q; i++;
              while(i<line.length&&line[i]!==q) v+=line[i++];
              v+=line[i]||q; i++;
              out+=`<span class="tok-value">${esc(v)}</span>`;
            }
          }
        }
        if(i<line.length&&line[i]==='>'){ out+=`<span class="tok-tag">&gt;</span>`; i++; }
      } else { out+=esc(line[i]); i++; }
    } else { out+=esc(line[i]); i++; }
  }
  return out;
}

function tokeniseCSS(line) {
  const t=line.trim();
  if(t.startsWith('/*')) return `<span class="tok-comment">${esc(line)}</span>`;
  if(t.startsWith('@')||(line.includes('{')&&!line.includes(':'))) return `<span class="tok-selector">${esc(line)}</span>`;
  if(t.startsWith('--')||t.startsWith(':root')){
    const c=line.indexOf(':');
    if(c!==-1) return `<span class="tok-prop">${esc(line.slice(0,c))}</span><span class="tok-punct">:</span><span class="tok-csval">${esc(line.slice(c+1))}</span>`;
  }
  const c=line.indexOf(':');
  if(c!==-1&&!t.startsWith('//')){
    return `<span class="tok-prop">${esc(line.slice(0,c))}</span><span class="tok-punct">:</span><span class="tok-csval">${esc(line.slice(c+1))}</span>`;
  }
  return `<span class="tok-plain">${esc(line)}</span>`;
}

function tokeniseJS(line) {
  const t=line.trim();
  if(t.startsWith('//')) return `<span class="tok-comment">${esc(line)}</span>`;
  let out='', i=0;
  while(i<line.length){
    const ch=line[i];
    if(ch==='"'||ch==="'"||ch==='`'){
      let s=ch; i++;
      while(i<line.length){
        if(line[i]==='\\'){s+=line[i]+(line[i+1]||'');i+=2;continue;}
        if(line[i]===ch){s+=line[i++];break;} s+=line[i++];
      }
      out+=`<span class="tok-string">${esc(s)}</span>`; continue;
    }
    if(/[0-9]/.test(ch)&&(i===0||!/[a-zA-Z_$]/.test(line[i-1]))){
      let n=''; while(i<line.length&&/[0-9\.]/.test(line[i])) n+=line[i++];
      out+=`<span class="tok-number">${esc(n)}</span>`; continue;
    }
    if(/[a-zA-Z_$]/.test(ch)){
      let w=''; while(i<line.length&&/[a-zA-Z0-9_$\.]/.test(line[i])) w+=line[i++];
      const isKw=JS_KEYWORDS.has(w), isDom=DOM_METHODS.has(w)||DOM_METHODS.has(w.split('.').pop());
      const isEv=JS_EVENTS.has(w), isCall=line[i]==='(';
      if(isKw) out+=`<span class="tok-keyword">${esc(w)}</span>`;
      else if(isDom) out+=`<span class="tok-dom">${esc(w)}</span>`;
      else if(isEv) out+=`<span class="tok-event">${esc(w)}</span>`;
      else if(isCall) out+=`<span class="tok-func">${esc(w)}</span>`;
      else out+=`<span class="tok-plain">${esc(w)}</span>`;
      continue;
    }
    if(/[+\-*\/%=<>!&|^~?:]/.test(ch)){ out+=`<span class="tok-operator">${esc(ch)}</span>`; i++; continue; }
    if(/[(){}\[\];,.]/.test(ch)){ out+=`<span class="tok-punct">${esc(ch)}</span>`; i++; continue; }
    out+=esc(ch); i++;
  }
  return out;
}

// ══════════════════════════════════════════════
//  FUNCTION EXTRACTOR (for flow chart)
// ══════════════════════════════════════════════
function extractFunctions(raw){
  const fns=[];
  const pats=[/function\s+([a-zA-Z_$][\w$]*)\s*\(/g,/(?:const|let|var)\s+([a-zA-Z_$][\w$]*)\s*=\s*(?:async\s+)?(?:function|\([^)]*\)\s*=>|\w+\s*=>)/g];
  pats.forEach(pat=>{
    let m; while((m=pat.exec(raw))!==null){
      const name=m[1]; if(!name||fns.find(f=>f.name===name)) continue;
      let bs=raw.indexOf('{',m.index+m[0].length), depth=0, pos=bs, body='';
      while(pos<raw.length){
        if(raw[pos]==='{') depth++;
        if(raw[pos]==='}'){depth--;if(depth===0){body=raw.slice(bs,pos+1);break;}} pos++;
      }
      const calls=[...new Set((body.match(/([a-zA-Z_$][\w$]*)\s*\(/g)||[]).map(c=>c.split('(')[0]).filter(n=>n!==name&&!JS_KEYWORDS.has(n)))];
      fns.push({name,calls,body:body.slice(0,300),annotation:inferAnn(name,body)});
    }
  });
  return fns;
}
function inferAnn(name,body){
  const b=body.toLowerCase(), parts=[];
  if(b.includes('display')&&b.includes('none')) parts.push('hides an element');
  if(b.includes('display')&&b.includes('block')) parts.push('shows an element');
  if(b.includes('appendchild')||b.includes('innerhtml')) parts.push('modifies the DOM');
  if(b.includes('addeventlistener')) parts.push('wires up events');
  if(b.includes('fetch')) parts.push('makes a network request');
  if(b.includes('setinterval')||b.includes('settimeout')) parts.push('uses a timer');
  if(b.includes('json.parse')||b.includes('json.stringify')) parts.push('handles JSON');
  if(b.includes('sort(')) parts.push('sorts data');
  if(b.includes('filter(')) parts.push('filters an array');
  if(b.includes('map(')) parts.push('transforms an array');
  if(b.includes('math.random')) parts.push('uses randomness');
  if(b.includes('if(')) parts.push('makes a decision');
  if(b.includes('for(')) parts.push('loops over items');
  if(b.includes('return')) parts.push('returns a value');
  if(!parts.length) parts.push('runs custom logic');
  return `<em>${name}()</em> — ${parts.join(', ')}.`;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
let globalBlocks = [];
let globalFns    = [];

document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('fileName').textContent=file.name;
  const type=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=ev=>{ processCode(ev.target.result, type); };
  reader.readAsText(file);
});

function processCode(raw, type){
  document.getElementById('emptyState')?.remove();
  document.getElementById('legend').style.display='flex';
  globalBlocks = segmentCode(raw, type);
  globalFns    = extractFunctions(raw);
  renderAnnotated();
}

function renderAnnotated(){
  const ws=document.getElementById('workspace');
  ws.innerHTML='';
  ws.style.gridTemplateColumns='1fr 340px';

  const cp=document.createElement('div'); cp.className='code-panel'; cp.id='codePanel';
  const ap=document.createElement('div'); ap.className='ann-panel';  ap.id='annPanel';
  const fp=document.createElement('div'); fp.className='flow-panel'; fp.id='flowPanel';

  ws.appendChild(cp); ws.appendChild(ap); ws.appendChild(fp);

  const table=document.createElement('table'); table.className='code-table';
  cp.appendChild(table);

  ap.innerHTML='<div class="ann-title">📝 Block Annotations</div>';

  globalBlocks.forEach((blk, bi)=>{
    const pal = BLOCK_PALETTE[blk.paletteId];

    // Annotation card
    const card=document.createElement('div');
    card.className='ann-block-card';
    card.id=`ann-blk-${bi}`;
    card.style.borderLeftColor = pal.accent;
    card.style.setProperty('--card-bg', pal.color);
    card.style.background = pal.color;

    const chipBg = pal.accent+'22';
    card.innerHTML=`
      <div class="ann-chip" style="background:${chipBg};color:${pal.accent}">${pal.emoji} ${pal.label}</div>
      <div class="ann-block-title">${esc(blk.label)}</div>
      <div class="ann-block-body"><ul>${blk.annotation.items.map(it=>`<li>${it}</li>`).join('')}</ul></div>
      <div class="ann-lines">Lines ${blk.startLine}–${blk.endLine}</div>
    `;
    card.onclick=()=>scrollToBlock(bi);
    ap.appendChild(card);

    // Code rows — grouped in a <tbody> per block so we can align it to its annotation card
    const tbody=document.createElement('tbody');
    tbody.id=`code-blk-${bi}`;
    tbody.dataset.block=bi;
    blk.linesData.forEach((ld, li)=>{
      const tr=document.createElement('tr');
      tr.className=`blk-row-${blk.paletteId}${li===0?' blk-first':''}`;
      tr.dataset.block=bi;

      const lineHtml=tokeniseLine(ld.raw, ld.mode);
      tr.innerHTML=`<td class="ln">${ld.lno}</td><td class="blabel-cell"></td><td class="lc">${lineHtml}</td>`;

      // hover only highlights — does NOT auto-scroll
      tr.addEventListener('mouseenter',()=>activateCard(bi,false));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
  });

  buildFlowchart(fp, globalFns);
  alignBlocks(globalBlocks.length);
  initTokenInspector();
}

// ══════════════════════════════════════════════
//  TOKEN INSPECTOR — select any word in the code and get
//  a detail popover pinned level with that exact line.
// ══════════════════════════════════════════════
let _tokDismissHandler=null;
function initTokenInspector(){
  const cp=document.getElementById('codePanel');
  const ap=document.getElementById('annPanel');
  if(!cp||!ap) return;
  cp.addEventListener('mouseup', ()=> setTimeout(()=>handleTokenSelection(cp,ap), 0));
  if(_tokDismissHandler) document.removeEventListener('mousedown', _tokDismissHandler);
  _tokDismissHandler=e=>{
    if(!cp.contains(e.target) && !e.target.closest?.('#tokPopover')) hideTokenPopover();
  };
  document.addEventListener('mousedown', _tokDismissHandler);
}

function hideTokenPopover(){
  const pop=document.getElementById('tokPopover');
  if(pop) pop.remove();
}

function handleTokenSelection(cp, ap){
  const sel=window.getSelection();
  const text=sel && sel.toString().trim();
  if(!text || text.length>40 || /\s/.test(text)){ return; }
  if(sel.rangeCount===0) return;
  const range=sel.getRangeAt(0);
  const rect=range.getBoundingClientRect();
  if(!rect || (rect.width===0 && rect.height===0)) return;

  let node=sel.anchorNode;
  let el=node && (node.nodeType===3 ? node.parentElement : node);
  let tokClass='';
  while(el && el!==cp){
    const m=(el.className||'').toString().match(/tok-(\w+)/);
    if(m){ tokClass=m[1]; break; }
    el=el.parentElement;
  }

  const info=explainToken(text, tokClass);
  if(!info){ hideTokenPopover(); return; }
  showTokenPopover(info, rect, ap);
}

function explainToken(raw, tokClass){
  const word=raw.trim().replace(/^[<>\/="';,.:(){}\[\]]+|[<>\/="';,.:(){}\[\]]+$/g,'');
  if(!word) return null;
  const wl=word.toLowerCase();
  const lookups=[
    { dict:ANN_LIB.htmlTags,   cat:'HTML Tag',        accent:'#ff7b72' },
    { dict:ANN_LIB.attrs,      cat:'HTML Attribute',  accent:'#ffa657' },
    { dict:ANN_LIB.cssProps,   cat:'CSS Property',    accent:'#79c0ff' },
    { dict:ANN_LIB.jsKeywords, cat:'JS Keyword',       accent:'#ff7b72' },
    { dict:ANN_LIB.domMethods, cat:'JS / DOM Method',  accent:'#56d364' },
  ];
  for(const {dict,cat,accent} of lookups){
    if(dict[word]!==undefined) return {word,cat,accent,desc:dict[word]};
  }
  for(const {dict,cat,accent} of lookups){
    const key=Object.keys(dict).find(k=>k.toLowerCase()===wl);
    if(key) return {word:key,cat,accent,desc:dict[key]};
  }
  // hyphenated CSS/JS names can't be fully double-click-selected — match by prefix
  for(const {dict,cat,accent} of lookups){
    const key=Object.keys(dict).find(k=>k.toLowerCase().startsWith(wl+'-'));
    if(key) return {word:key,cat,accent,desc:dict[key],approx:true};
  }
  const generic={
    tag:     ['HTML Tag','An HTML element name.'],
    attr:    ['HTML Attribute','A property set on this element.'],
    value:   ['Attribute Value','The value assigned to an attribute.'],
    selector:['CSS Selector','Targets which elements this rule applies to.'],
    prop:    ['CSS Property','A style property being set.'],
    csval:   ['CSS Value','The value(s) applied on this declaration.'],
    keyword: ['JS Keyword','A reserved JavaScript keyword.'],
    func:    ['Function Call','Calls a function — look above for where it\'s defined.'],
    string:  ['String','A literal text value.'],
    number:  ['Number','A numeric literal.'],
    operator:['Operator','Performs a comparison, assignment, or calculation.'],
    dom:     ['DOM / Built-in','A built-in browser or JS method.'],
    event:   ['Event Name','The type of user interaction being listened for.'],
    punct:   ['Punctuation','Structural syntax character.'],
  };
  if(tokClass && generic[tokClass]) return {word,cat:generic[tokClass][0],accent:'#8b949e',desc:generic[tokClass][1]};
  return null;
}

function showTokenPopover(info, rowRect, ap){
  hideTokenPopover();
  const apRect=ap.getBoundingClientRect();
  const relTop=Math.max(0, rowRect.top - apRect.top - 6);

  const pop=document.createElement('div');
  pop.id='tokPopover';
  pop.className='tok-popover';
  pop.style.top=relTop+'px';
  pop.style.borderColor=info.accent;
  pop.innerHTML=`
    <div class="tok-pop-close" onclick="hideTokenPopover()">✕</div>
    <div class="ann-chip" style="background:${info.accent}22;color:${info.accent}">${esc(info.cat)}</div>
    <div class="tok-pop-word">${esc(info.word)}</div>
    <div class="tok-pop-body">${info.desc}${info.approx?'<br><span style="color:var(--muted);font-size:.68rem;">(closest match to your selection)</span>':''}</div>
  `;
  ap.appendChild(pop);
}

function activateCard(bi, scroll){
  document.querySelectorAll('.ann-block-card').forEach(c=>c.classList.remove('active-card'));
  const card=document.getElementById(`ann-blk-${bi}`);
  if(card){ card.classList.add('active-card'); if(scroll) card.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function scrollToBlock(bi){
  activateCard(bi, false);
  const tbody=document.getElementById(`code-blk-${bi}`);
  if(tbody) tbody.scrollIntoView({block:'start',behavior:'smooth'});
}

// ══════════════════════════════════════════════
//  ALIGN CODE BLOCKS WITH THEIR ANNOTATION CARDS
//  Inserts spacers so block N always starts at the same
//  vertical position on both sides of the workspace.
// ══════════════════════════════════════════════
function alignBlocks(count){
  // clear any previous spacers from an earlier render
  document.querySelectorAll('.blk-spacer-row, .blk-spacer-card').forEach(el=>el.remove());

  const starts=[];
  for(let bi=0; bi<count; bi++){
    const tbody=document.getElementById(`code-blk-${bi}`);
    const card=document.getElementById(`ann-blk-${bi}`);
    if(!tbody||!card) continue;
    starts.push({ bi, tbody, card, codeTop: tbody.getBoundingClientRect().top, annTop: card.getBoundingClientRect().top });
  }

  let corrCode=0, corrAnn=0;
  starts.forEach(({bi,tbody,card,codeTop,annTop})=>{
    const diff = (annTop+corrAnn) - (codeTop+corrCode);
    if(diff > 1){
      const spacerRow=document.createElement('tr');
      spacerRow.className='blk-spacer-row';
      spacerRow.innerHTML=`<td colspan="3" style="height:${diff}px;padding:0;border:0;"></td>`;
      tbody.insertBefore(spacerRow, tbody.firstChild);
      corrCode += diff;
    } else if(diff < -1){
      const spacer=document.createElement('div');
      spacer.className='blk-spacer-card';
      spacer.style.height=(-diff)+'px';
      card.parentNode.insertBefore(spacer, card);
      corrAnn += -diff;
    }
  });
}

// ══════════════════════════════════════════════
//  FLOWCHART
// ══════════════════════════════════════════════
function buildFlowchart(container, fns){
  if(!fns.length){ container.innerHTML='<div class="flow-title">Logic Flow</div><div style="color:var(--muted);font-size:.85rem;">No JS functions found.</div>'; return; }
  const NW=160, NH=42, COLS=Math.min(fns.length,5), ROWS=Math.ceil(fns.length/COLS);
  const CX=200, CY=110, MX=60, MY=60;
  const W=MX*2+COLS*CX, H=MY*2+ROWS*CY+80;

  const pos={};
  fns.forEach((fn,i)=>{ pos[fn.name]={x:MX+(i%COLS)*CX,y:MY+80+Math.floor(i/COLS)*CY}; });

  let svg=`<svg class="flowchart" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L0,6 L7,3 z" fill="#58a6ff"/></marker></defs>`;

  // START
  const sx=W/2, sy=40;
  svg+=`<ellipse cx="${sx}" cy="${sy}" rx="38" ry="16" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="${sx}" y="${sy+5}" text-anchor="middle" fill="#58a6ff" font-size="11" font-family="monospace">START</text>`;

  // Nodes
  fns.forEach((fn,i)=>{
    const {x,y}=pos[fn.name];
    const cx=x+NW/2;
    svg+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="6" fill="${i%2?'#1c2128':'#161b22'}" stroke="#30363d" stroke-width="1.5"/>`;
    const label=fn.name.length>18?fn.name.slice(0,16)+'…':fn.name;
    svg+=`<text x="${cx}" y="${y+16}" text-anchor="middle" fill="#e3b341" font-size="11.5" font-family="'Fira Code',monospace" font-weight="600">${esc(label)}()</text>`;
    const desc=(fn.annotation.match(/— (.+?)\./)||['',''])[1].replace(/<[^>]+>/g,'').slice(0,28);
    svg+=`<text x="${cx}" y="${y+32}" text-anchor="middle" fill="#7d8590" font-size="9.5" font-family="sans-serif">${esc(desc)}</text>`;
    // start → node
    svg+=`<line x1="${sx}" y1="${sy+16}" x2="${cx}" y2="${y}" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>`;
    // call arrows
    fn.calls.forEach(callee=>{
      const t=pos[callee]; if(!t) return;
      const x1=x+NW,y1=y+NH/2,x2=t.x,y2=t.y+NH/2;
      svg+=`<path d="M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}" fill="none" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)" opacity=".5"/>`;
      svg+=`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle" class="fc-label">calls</text>`;
    });
  });
  svg+='</svg>';

  // Function cards below
  let cards='<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:24px;">';
  fns.forEach(fn=>{
    cards+=`<div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:200px;max-width:300px;">
      <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:3px;">Function</div>
      <div style="font-family:monospace;font-size:.85rem;color:#e3b341;font-weight:700;margin-bottom:4px;">${esc(fn.name)}()</div>
      <div style="font-size:.75rem;color:#adbac7;line-height:1.5;">${fn.annotation}</div>
    </div>`;
  });
  cards+='</div>';
  container.innerHTML=`<div class="flow-title">🔀 Logic Flow — ${fns.length} Function${fns.length!==1?'s':''}</div><div class="flow-svg-wrap">${svg}</div>${cards}`;
}

// ══════════════════════════════════════════════
//  VIEW SWITCHER
// ══════════════════════════════════════════════
function switchView(v){
  ['annotated','flow'].forEach(x=>document.getElementById('btn-'+x).classList.toggle('active',x===v));
  const cp=document.getElementById('codePanel');
  const ap=document.getElementById('annPanel');
  const fp=document.getElementById('flowPanel');
  const ws=document.getElementById('workspace');
  if(!cp) return;
  if(v==='annotated'){
    cp.style.display=''; ap.style.display='';
    fp.classList.remove('visible');
    ws.style.gridTemplateColumns='1fr 340px';
  } else {
    cp.style.display='none'; ap.style.display='none';
    fp.classList.add('visible');
    ws.style.gridTemplateColumns='1fr';
  }
}
